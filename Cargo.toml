[package]
name = "hx-claude-ide"
edition = "2021"
version = "0.1.0"
license = "MPL-2.0"
publish = false

[lib]
name = "claude_ide"
# cdylib = a C-ABI dynamic library (.dylib/.so/.dll). This is what Steel's forge
# loads at runtime; the file it produces is `libclaude_ide.<ext>`.
# rlib is added so the `tests/protocol.rs` integration suite can link the crate
# as a normal Rust library (a cdylib alone can't be linked by a test binary).
# It does not affect the shipped dylib.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to the exact steel rev Helix (hx-steel) is built from, so our dylib is
# ABI-compatible with the host. The crate is `steel-core` but its lib is named
# `steel`, so in code we write `use steel::...`.
#
# The feature set MUST match the host's exactly — features like `sync`, `biased`,
# and `imbl` change the in-memory layout of `SteelVal`/FFI types, and a mismatch
# surfaces at load time as an `abi_stable` "incompatible type size" panic. This
# list mirrors helix's workspace `Cargo.toml` (`[workspace.dependencies]
# steel-core`); re-check it whenever the host is rebuilt from a new revision.
steel-core = { git = "https://github.com/mattwparas/steel.git", rev = "3a418c9", features = ["anyhow", "dylibs", "sync", "biased", "imbl"] }
# Provides the stable-ABI plumbing the `declare_module!` macro relies on.
abi_stable = "0.11.1"
# Cross-platform access to the OS cryptographic RNG (for the auth token).
getrandom = "0.2"
# Builds the lock file / protocol JSON via the `json!` macro.
serde_json = "1"
tungstenite = "0.30.0"
# For `kill(pid, 0)` liveness checks when sweeping stale lockfiles on startup.
libc = "0.2"
